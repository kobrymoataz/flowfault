name: Verify

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependency-free project
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Source verification
        run: npm run typecheck
      - name: Build CLI
        run: npm run build
      - name: Smoke test CLI
        run: node dist/cli.mjs --help
