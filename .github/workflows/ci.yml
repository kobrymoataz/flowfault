name: Verify

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Source verification
        run: npm run typecheck
      - name: Build CLI
        run: npm run build
      - name: Smoke test CLI
        run: node dist/cli.mjs --help
      - name: Check installed Chrome
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node dist/cli.mjs doctor
      - name: Browser test without network navigation
        run: |
          npm run test:browser-offline
          npm run test:scenario-browser-offline
      - name: Local fixture integration
        run: |
          npm run test:integration
          npm run test:scenarios
      - name: Local fixture scenario demo
        run: npm run demo:scenarios
